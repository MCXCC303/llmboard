[package]
name = "llmboard"
version = "0.1.0"
edition = "2024"
authors = ["MCXCC303"]
description = "LLMBoard - 多供应商 LLM 余额看板框架"

[lib]
crate-type = ["cdylib"]

[dependencies]
llmboard-core = { path = "core" }
wit-bindgen = { version = "0.47.0", features = ["async", "async-spawn"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
waki = "0.5.1"
serde_json = "1.0"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }